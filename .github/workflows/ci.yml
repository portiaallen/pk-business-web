name: Security containment CI

on:
  push:
    branches: [main, feat/pk-would-work-here]
  pull_request:

permissions:
  contents: read

jobs:
  containment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:security:phase1a
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npx eslint src/lib/security-log.ts src/lib/security-environment.ts src/lib/document-access.ts scripts/test-phase1a.mjs scripts/test-card-checkout.mjs
